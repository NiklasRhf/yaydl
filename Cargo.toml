[package]
name = "yaydl-ui"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "yaydl-ui"
path = "src-ui/main.rs"

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos_icons = "0.7.1"
icondata = "0.7.0"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "ClipboardEvent", "DataTransfer", "DragEvent", "KeyboardEvent", "MediaQueryList", "MediaQueryListEvent", "DomTokenList"] }
serde = { workspace = true }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
yaydl-shared = { workspace = true}

[workspace]
members = [ "src-shared","src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
yaydl-shared = { path = "./src-shared/" }
thiserror = "2.0.20"
