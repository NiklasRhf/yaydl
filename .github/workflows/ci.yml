name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (backend and shared)
        run: cargo clippy -p yaydl -p yaydl-shared --all-targets -- -D warnings

      - name: Clippy (UI, wasm)
        run: cargo clippy -p yaydl-ui --target wasm32-unknown-unknown -- -D warnings

      - name: Tests
        run: cargo test -p yaydl -p yaydl-shared
