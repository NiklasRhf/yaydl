name: Release
on:
  push:
    tags:
      - "yaydl-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "yaydl-v$version" ]; then
            echo "tag $tag does not match tauri.conf.json version $version (expected yaydl-v$version)"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2

      # Prebuilt binary, compiling trunk from source cost over ten minutes per leg.
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: yaydl-v__VERSION__
          releaseName: "YaYDL v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
